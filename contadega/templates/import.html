{% extends 'base.html' %}{% block content %}<h1>Importar vinhos</h1><section class="card"><p><a href="{{ url_for('main.csv_template') }}">Baixar arquivo-modelo CSV</a></p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Arquivo CSV UTF-8<input type="file" name="file" accept=".csv,text/csv" required></label><button>Validar e pré-visualizar</button></form></section>{% if preview %}<section class="card"><h2>Pré-visualização ({{ preview|length }})</h2><div class="table-wrap"><table><tr><th>Nome</th><th>Produtor</th><th>Código</th></tr>{% for row in preview %}<tr><td>{{ row.name }}</td><td>{{ row.producer }}</td><td>{{ row.barcode or '—' }}</td></tr>{% endfor %}</table></div><form method="post" data-confirm="Confirmar a importação de todos os itens?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="yes"><button>Confirmar importação</button></form></section>{% endif %}{% endblock %}
