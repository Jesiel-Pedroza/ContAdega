{% extends 'base.html' %}{% block content %}<h1>Inventários</h1>{% if current_user.has_role('administrador') %}<details class="card" open><summary>Novo inventário e escopo</summary><form method="post" class="grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Identificação<input name="name" required></label><label>Adega<select name="cellar_id">{% for c in cellars %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></label><fieldset><legend>Posições</legend>{% for p in positions %}<label class="check"><input type="checkbox" name="positions" value="{{p.id}}">{{p.code}} · {{p.sector.name}}</label>{% endfor %}</fieldset><label>Observações<textarea name="notes"></textarea></label><button>Criar rascunho</button></form></details>{% endif %}<section class="card"><table><tr><th>Nome</th><th>Adega</th><th>Status</th></tr>{% for i in inventories %}<tr><td><a href="{{url_for('main.inventory_detail',inventory_id=i.id)}}">{{i.name}}</a></td><td>{{i.cellar.name}}</td><td><span class="badge">{{i.status}}</span></td></tr>{% endfor %}</table></section>{% endblock %}
